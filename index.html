<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ARASAAC SEN Worksheet Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Codystar&family=Raleway+Dots&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #2563eb;
    --bg: #f1f5f9;
    --panel: #ffffff;
    --border: #cbd5e1;
    --text: #0f172a;
    --word-size: 2.3rem;
    --picto-size: 120px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Atkinson Hyperlegible', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    min-height: 100vh;
  }

  /* Sidebar Controls (Hidden when printing) */
  .sidebar {
    width: 390px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
    height: 100vh;
    position: sticky;
    top: 0;
  }

  .sidebar h1 {
    font-size: 1.18rem;
    margin: 0;
    color: var(--primary);
  }

  .sidebar p.sub {
    font-size: 0.83rem;
    color: #475569;
    margin: 2px 0 2px 0;
  }

  label {
    display: block;
    font-size: 0.82rem;
    font-weight: 700;
    margin-bottom: 4px;
    color: #334155;
  }

  input[type="text"], textarea, select {
    width: 100%;
    padding: 7px 9px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: inherit;
    font-size: 0.9rem;
  }

  textarea {
    resize: vertical;
    min-height: 98px;
    line-height: 1.38;
  }

  .card-box {
    border: 1px solid #cbd5e1;
    background: #f8fafc;
    border-radius: 8px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .logo-box {
    border: 1px dashed #94a3b8;
    background: #f8fafc;
    border-radius: 8px;
    padding: 9px;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  input[type="file"] {
    font-size: 0.8rem;
    width: 100%;
    cursor: pointer;
  }

  .slider-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 0.8rem;
    color: #475569;
  }

  .slider-row input[type="range"] {
    flex: 1;
    cursor: pointer;
  }

  .slider-val {
    font-weight: 700;
    color: #0f172a;
    min-width: 42px;
    text-align: right;
  }

  .inline-group {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .inline-group input,
  .inline-group select {
    flex: 1;
  }

  .btn-xs {
    padding: 6px 9px;
    font-size: 0.78rem;
    border: 1px solid #cbd5e1;
    background: #fff;
    color: #334155;
    border-radius: 5px;
    cursor: pointer;
    font-weight: 700;
    white-space: nowrap;
  }

  .btn-xs:hover {
    background: #e2e8f0;
  }

  .btn-xs.danger:hover {
    background: #fee2e2;
    border-color: #fca5a5;
    color: #b91c1c;
  }

  .btn-xs.primary {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
  }

  .btn-xs.primary:hover {
    opacity: 0.9;
  }

  .row-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .btn {
    padding: 9px 14px;
    border: none;
    border-radius: 6px;
    font-family: inherit;
    font-weight: 700;
    font-size: 0.92rem;
    cursor: pointer;
    transition: opacity 0.15s;
  }

  .btn:hover { opacity: 0.9; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-secondary { background: #e2e8f0; color: #1e293b; }
  .btn-success { background: #16a34a; color: #fff; }

  .status {
    font-size: 0.8rem;
    color: #475569;
    min-height: 1.2em;
  }

  /* Preview Area */
  .preview-wrapper {
    flex: 1;
    padding: 24px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    overflow-y: auto;
  }

  /* A4 Sheet */
  .sheet {
    width: 210mm;
    min-height: 297mm;
    background: #fff;
    padding: 14mm 16mm;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .sheet-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid #e2e8f0;
    padding-bottom: 10px;
    margin-bottom: 16px;
    gap: 16px;
  }

  .name-field {
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 1px;
    white-space: nowrap;
  }

  .name-dots {
    display: inline-block;
    width: 190px;
    border-bottom: 2px dotted #334155;
    margin-left: 6px;
  }

  .school-brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .school-info {
    text-align: right;
    font-size: 0.95rem;
    color: #334155;
    line-height: 1.3;
  }

  .school-logo {
    max-height: 54px;
    max-width: 130px;
    object-fit: contain;
    display: none;
  }

  .sheet-title {
    text-align: center;
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    margin: 0 0 14px 0;
    text-transform: uppercase;
  }

  /* Worksheet Body Layouts */
  .items-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    gap: 12px;
  }

  /* Mode: Match & Trace (2 Columns) */
  .match-grid {
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    gap: 24px;
    align-items: center;
    flex: 1;
  }

  .left-col, .right-col {
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    height: 100%;
    gap: 12px;
  }

  .word-row {
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: var(--picto-size);
  }

  .word-label {
    font-size: var(--word-size);
    text-transform: uppercase;
    letter-spacing: 3px;
    line-height: 1.1;
    color: #000;
  }

  .font-dotted {
    font-family: 'Raleway Dots', 'Codystar', monospace;
    font-weight: 700;
  }

  .font-solid {
    font-family: 'Atkinson Hyperlegible', Arial, sans-serif;
    font-weight: 700;
  }

  .anchor-dot {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    flex-shrink: 0;
    border: 2px solid rgba(0,0,0,0.18);
    cursor: pointer;
    transition: transform 0.12s ease;
  }

  .anchor-dot:hover {
    transform: scale(1.18);
  }

  .target-dot-empty {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px dashed #64748b;
    flex-shrink: 0;
  }

  .picto-row {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 14px;
    min-height: var(--picto-size);
    position: relative;
  }

  .picto-box {
    width: var(--picto-size);
    height: var(--picto-size);
    border: 2px solid #cbd5e1;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px;
    background: #fff;
    position: relative;
  }

  .picto-box img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  /* Mode: Reference Sheet (Aligned Pairs) */
  .ref-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    padding: 8px 20px;
  }

  .ref-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  /* Mode: Cut & Paste */
  .cut-targets {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }

  .cut-slot {
    border: 2px solid #94a3b8;
    border-radius: 10px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .cut-slot .word-label {
    font-size: calc(var(--word-size) * 0.78);
  }

  .empty-drop-box {
    width: var(--picto-size);
    height: var(--picto-size);
    border: 2px dashed #94a3b8;
    border-radius: 8px;
  }

  .cut-strip {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 3px dashed #475569;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-around;
    gap: 10px;
  }

  .cut-card {
    width: calc(var(--picto-size) * 0.92);
    height: calc(var(--picto-size) * 0.92);
    border: 2px dashed #334155;
    padding: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .cut-card img {
    max-width: 100%;
    max-height: 100%;
  }

  /* Pictogram Switcher Overlay (Hidden in print) */
  .picto-controls {
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    background: #1e293b;
    color: #fff;
    border-radius: 12px;
    padding: 2px 6px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.72rem;
    white-space: nowrap;
  }

  .picto-controls button {
    background: none;
    border: none;
    color: #fff;
    cursor: pointer;
    font-weight: bold;
    padding: 0 3px;
  }

  .sheet-footer {
    margin-top: 14px;
    font-size: 0.7rem;
    color: #64748b;
    text-align: center;
  }

  @media print {
    body { background: #fff; }
    .sidebar, .picto-controls { display: none !important; }
    .preview-wrapper { padding: 0; }
    .sheet {
      box-shadow: none;
      width: 100%;
      min-height: auto;
      padding: 0;
    }
    @page {
      size: A4;
      margin: 12mm;
    }
  }
</style>
</head>
<body>

  <aside class="sidebar">
    <div>
      <h1>ARASAAC Worksheet Builder</h1>
      <p class="sub">SEN English Vocabulary Generator</p>
    </div>

    <!-- Save & Reload Units -->
    <div class="card-box">
      <label style="margin-bottom:0;">Saved Vocabulary Units</label>
      <div class="inline-group">
        <input type="text" id="unitNameInput" placeholder="Unit name (e.g. Daily Routines)" />
        <button type="button" class="btn-xs primary" onclick="saveCurrentUnit()">Save</button>
      </div>
      <div class="inline-group">
        <select id="savedUnitsSelect">
          <option value="">-- No saved units yet --</option>
        </select>
        <button type="button" class="btn-xs" onclick="loadSelectedUnit()">Load</button>
        <button type="button" class="btn-xs danger" onclick="deleteSelectedUnit()">Delete</button>
      </div>
    </div>

    <div>
      <label for="wordsInput">Target Words (one per line)</label>
      <textarea id="wordsInput">GET UP
GET DRESSED
LUNCH
SUPPER
GO TO BED</textarea>
    </div>

    <div class="row-2">
      <div>
        <label for="searchLang">ARASAAC Search Lang</label>
        <select id="searchLang">
          <option value="en" selected>English (en)</option>
          <option value="es">Spanish (es)</option>
          <option value="ca">Catalan (ca)</option>
        </select>
      </div>
      <div>
        <label for="sheetMode">Worksheet Style</label>
        <select id="sheetMode" onchange="renderWorksheet()">
          <option value="match" selected>Match & Trace</option>
          <option value="reference">Vocabulary Reference</option>
          <option value="cutpaste">Cut & Paste Sort</option>
        </select>
      </div>
    </div>

    <div class="row-2">
      <div>
        <label for="fontStyle">Letter Style</label>
        <select id="fontStyle" onchange="renderWorksheet()">
          <option value="dotted" selected>Dotted (Tracing)</option>
          <option value="solid">Solid Bold</option>
        </select>
      </div>
      <div>
        <label for="dotMode">Color Dots (Click dot to edit)</label>
        <select id="dotMode" onchange="renderWorksheet()">
          <option value="left-only" selected>Left Words Only</option>
          <option value="both-colored">Both Sides Colored</option>
          <option value="left-empty-right">Left Colored + Right Circle</option>
          <option value="none">No Dots</option>
        </select>
      </div>
    </div>

    <!-- Quick Size Sliders -->
    <div class="card-box">
      <label style="margin-bottom:0;">Quick Size Sliders</label>
      <div class="slider-row">
        <span>Words</span>
        <input type="range" id="wordSizeSlider" min="1.2" max="3.4" step="0.1" value="2.3" oninput="updateSizes()" />
        <span class="slider-val" id="wordSizeVal">2.3</span>
      </div>
      <div class="slider-row">
        <span>Pictos</span>
        <input type="range" id="pictoSizeSlider" min="75" max="175" step="5" value="120" oninput="updateSizes()" />
        <span class="slider-val" id="pictoSizeVal">120px</span>
      </div>
    </div>

    <div>
      <label for="logoInput">School Logo (PNG, JPG, SVG)</label>
      <div class="logo-box">
        <input type="file" id="logoInput" accept="image/*" onchange="handleLogoUpload(event)" />
        <div class="slider-row" id="logoControls" style="display:none;">
          <span>Size</span>
          <input type="range" id="logoSize" min="32" max="90" value="54" oninput="updateLogoSize()" />
          <button type="button" class="btn-xs danger" onclick="clearLogo()">Remove</button>
        </div>
      </div>
    </div>

    <div class="row-2">
      <div>
        <label for="schoolName">School Name</label>
        <input type="text" id="schoolName" value="Escola Pompeu Fabra" oninput="renderWorksheet()" />
      </div>
      <div>
        <label for="schoolTown">Town / Subtitle</label>
        <input type="text" id="schoolTown" value="Vilanova del Camí" oninput="renderWorksheet()" />
      </div>
    </div>

    <div>
      <label for="sheetTitle">Worksheet Title (Optional)</label>
      <input type="text" id="sheetTitle" value="English — Daily Routines" oninput="renderWorksheet()" />
    </div>

    <button class="btn btn-primary" onclick="fetchAllPictograms()">Fetch Pictograms & Build</button>
    <div class="row-2">
      <button class="btn btn-secondary" onclick="shufflePictograms()">Shuffle Pictures</button>
      <button class="btn btn-success" onclick="window.print()">Print / Save PDF</button>
    </div>

    <div class="status" id="statusText">Ready. Click any colored dot on the sheet to change its color.</div>
  </aside>

  <main class="preview-wrapper">
    <div class="sheet" id="worksheet">
      <div>
        <div class="sheet-header">
          <div class="name-field">NAME <span class="name-dots"></span></div>
          <div class="school-brand">
            <div class="school-info">
              <div id="dispSchool">Escola Pompeu Fabra</div>
              <div id="dispTown">Vilanova del Camí</div>
            </div>
            <img id="dispLogo" class="school-logo" alt="School Logo" />
          </div>
        </div>
        <h2 class="sheet-title" id="dispTitle">English — Daily Routines</h2>
      </div>

      <div class="items-container" id="sheetBody"></div>

      <div class="sheet-footer">
        Pictograms: ARASAAC (Sergio Palao) — Government of Aragón (CC BY-NC-SA)
      </div>
    </div>
  </main>

<script>
  const DOT_COLORS = [
    '#f97316', // orange
    '#3b82f6', // blue
    '#ef4444', // red
    '#22c55e', // green
    '#a855f7', // purple
    '#eab308', // yellow
    '#ec4899', // pink
    '#14b8a6', // teal
    '#0f172a'  // dark navy/black
  ];

  const UNITS_STORAGE_KEY = 'sen_saved_units_v1';

  let items = [];
  let shuffledOrder = [];

  /* ---------- Quick Size Sliders ---------- */
  function updateSizes() {
    const wordSize = document.getElementById('wordSizeSlider').value;
    const pictoSize = document.getElementById('pictoSizeSlider').value;

    document.documentElement.style.setProperty('--word-size', wordSize + 'rem');
    document.documentElement.style.setProperty('--picto-size', pictoSize + 'px');

    document.getElementById('wordSizeVal').textContent = wordSize;
    document.getElementById('pictoSizeVal').textContent = pictoSize + 'px';
  }

  /* ---------- Editable Dot Colors ---------- */
  function cycleDotColor(itemIdx) {
    const item = items[itemIdx];
    if (!item) return;
    const currIdx = DOT_COLORS.indexOf(item.color);
    const nextIdx = (currIdx + 1) % DOT_COLORS.length;
    item.color = DOT_COLORS[nextIdx];
    renderWorksheet();
  }

  /* ---------- Save & Reload Units ---------- */
  function getSavedUnits() {
    try {
      return JSON.parse(localStorage.getItem(UNITS_STORAGE_KEY) || '{}');
    } catch (e) {
      return {};
    }
  }

  function refreshSavedUnitsDropdown(selectName = '') {
    const units = getSavedUnits();
    const names = Object.keys(units).sort((a, b) => a.localeCompare(b));
    const select = document.getElementById('savedUnitsSelect');

    if (names.length === 0) {
      select.innerHTML = '<option value="">-- No saved units yet --</option>';
      return;
    }

    select.innerHTML = names
      .map(name => `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`)
      .join('');

    if (selectName && units[selectName]) {
      select.value = selectName;
    }
  }

  function saveCurrentUnit() {
    const nameInput = document.getElementById('unitNameInput');
    let unitName = nameInput.value.trim();
    if (!unitName) {
      unitName = document.getElementById('sheetTitle').value.trim() || 'Untitled Unit';
      nameInput.value = unitName;
    }

    const units = getSavedUnits();
    units[unitName] = {
      wordsText: document.getElementById('wordsInput').value,
      searchLang: document.getElementById('searchLang').value,
      sheetMode: document.getElementById('sheetMode').value,
      fontStyle: document.getElementById('fontStyle').value,
      dotMode: document.getElementById('dotMode').value,
      sheetTitle: document.getElementById('sheetTitle').value,
      wordSize: document.getElementById('wordSizeSlider').value,
      pictoSize: document.getElementById('pictoSizeSlider').value,
      items: items,
      shuffledOrder: shuffledOrder
    };

    try {
      localStorage.setItem(UNITS_STORAGE_KEY, JSON.stringify(units));
      refreshSavedUnitsDropdown(unitName);
      document.getElementById('statusText').textContent = `Saved unit "${unitName}" (including chosen pictograms & dot colors).`;
    } catch (err) {
      document.getElementById('statusText').textContent = 'Could not save unit (browser storage full).';
    }
  }

  function loadSelectedUnit() {
    const select = document.getElementById('savedUnitsSelect');
    const unitName = select.value;
    if (!unitName) return;

    const units = getSavedUnits();
    const data = units[unitName];
    if (!data) return;

    document.getElementById('unitNameInput').value = unitName;
    document.getElementById('wordsInput').value = data.wordsText || '';
    document.getElementById('searchLang').value = data.searchLang || 'en';
    document.getElementById('sheetMode').value = data.sheetMode || 'match';
    document.getElementById('fontStyle').value = data.fontStyle || 'dotted';
    document.getElementById('dotMode').value = data.dotMode || 'left-only';
    document.getElementById('sheetTitle').value = data.sheetTitle || '';

    if (data.wordSize) document.getElementById('wordSizeSlider').value = data.wordSize;
    if (data.pictoSize) document.getElementById('pictoSizeSlider').value = data.pictoSize;
    updateSizes();

    items = Array.isArray(data.items) ? data.items : [];
    shuffledOrder = Array.isArray(data.shuffledOrder) && data.shuffledOrder.length === items.length
      ? data.shuffledOrder
      : items.map((_, idx) => idx);

    renderWorksheet();
    document.getElementById('statusText').textContent = `Loaded unit "${unitName}".`;
  }

  function deleteSelectedUnit() {
    const select = document.getElementById('savedUnitsSelect');
    const unitName = select.value;
    if (!unitName) return;

    const units = getSavedUnits();
    delete units[unitName];
    try {
      localStorage.setItem(UNITS_STORAGE_KEY, JSON.stringify(units));
    } catch (e) {}

    refreshSavedUnitsDropdown();
    document.getElementById('statusText').textContent = `Deleted unit "${unitName}".`;
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
  }

  /* ---------- School Logo ---------- */
  function applyLogoDataUrl(dataUrl) {
    const img = document.getElementById('dispLogo');
    const controls = document.getElementById('logoControls');
    if (dataUrl) {
      img.src = dataUrl;
      img.style.display = 'block';
      controls.style.display = 'flex';
    } else {
      img.removeAttribute('src');
      img.style.display = 'none';
      controls.style.display = 'none';
    }
  }

  function handleLogoUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      const dataUrl = e.target.result;
      applyLogoDataUrl(dataUrl);
      try {
        localStorage.setItem('sen_school_logo', dataUrl);
      } catch (err) {}
    };
    reader.readAsDataURL(file);
  }

  function updateLogoSize() {
    const size = document.getElementById('logoSize').value;
    const img = document.getElementById('dispLogo');
    img.style.maxHeight = size + 'px';
    try {
      localStorage.setItem('sen_school_logo_size', size);
    } catch (err) {}
  }

  function clearLogo() {
    document.getElementById('logoInput').value = '';
    applyLogoDataUrl(null);
    try {
      localStorage.removeItem('sen_school_logo');
    } catch (err) {}
  }

  function restoreSavedLogo() {
    try {
      const savedLogo = localStorage.getItem('sen_school_logo');
      const savedSize = localStorage.getItem('sen_school_logo_size');
      if (savedSize) {
        document.getElementById('logoSize').value = savedSize;
        document.getElementById('dispLogo').style.maxHeight = savedSize + 'px';
      }
      if (savedLogo) {
        applyLogoDataUrl(savedLogo);
      }
    } catch (err) {}
  }

  /* ---------- ARASAAC Fetch & Render ---------- */
  async function fetchAllPictograms() {
    const rawLines = document.getElementById('wordsInput').value
      .split('\n')
      .map(w => w.trim())
      .filter(w => w.length > 0);

    if (rawLines.length === 0) return;

    const lang = document.getElementById('searchLang').value;
    const status = document.getElementById('statusText');
    status.textContent = 'Searching ARASAAC pictograms...';

    const newItems = [];

    for (let i = 0; i < rawLines.length; i++) {
      const label = rawLines[i];
      const query = encodeURIComponent(label.toLowerCase());
      try {
        const res = await fetch(`https://api.arasaac.org/v1/pictograms/${lang}/search/${query}`);
        if (!res.ok) throw new Error('Not found');
        const data = await res.json();
        const ids = Array.isArray(data) ? data.map(p => p._id) : [];
        newItems.push({
          word: label.toUpperCase(),
          results: ids,
          selectedIndex: 0,
          color: DOT_COLORS[i % DOT_COLORS.length]
        });
      } catch (err) {
        newItems.push({
          word: label.toUpperCase(),
          results: [],
          selectedIndex: 0,
          color: DOT_COLORS[i % DOT_COLORS.length]
        });
      }
    }

    items = newItems;
    shuffledOrder = items.map((_, idx) => idx);
    shuffleArray(shuffledOrder);
    if (items.length > 1 && shuffledOrder.every((val, idx) => val === idx)) {
      shuffledOrder.push(shuffledOrder.shift());
    }

    status.textContent = `Loaded ${items.length} items. Click any colored dot to change its color, or ◀ ▶ to swap symbols.`;
    renderWorksheet();
  }

  function shufflePictograms() {
    if (items.length < 2) return;
    shuffleArray(shuffledOrder);
    renderWorksheet();
  }

  function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  }

  function cyclePicto(itemIdx, delta) {
    const item = items[itemIdx];
    if (!item || item.results.length <= 1) return;
    item.selectedIndex = (item.selectedIndex + delta + item.results.length) % item.results.length;
    renderWorksheet();
  }

  function getPictoUrl(item) {
    if (!item.results || item.results.length === 0) return null;
    const id = item.results[item.selectedIndex];
    return `https://static.arasaac.org/pictograms/${id}/${id}_500.png`;
  }

  function renderPictoBox(itemIdx, extraClass = 'picto-box') {
    const item = items[itemIdx];
    const url = getPictoUrl(item);
    const total = item.results.length;
    const controls = total > 1
      ? `<div class="picto-controls">
           <button onclick="cyclePicto(${itemIdx}, -1)" title="Previous symbol">◀</button>
           <span>${item.selectedIndex + 1}/${total}</span>
           <button onclick="cyclePicto(${itemIdx}, 1)" title="Next symbol">▶</button>
         </div>`
      : '';

    const imgHtml = url
      ? `<img src="${url}" alt="${item.word}" crossorigin="anonymous" />`
      : `<span style="font-size:0.75rem;color:#94a3b8;text-align:center;">No symbol found</span>`;

    return `<div class="${extraClass}">${imgHtml}${controls}</div>`;
  }

  function renderWorksheet() {
    document.getElementById('dispSchool').textContent = document.getElementById('schoolName').value;
    document.getElementById('dispTown').textContent = document.getElementById('schoolTown').value;
    const titleVal = document.getElementById('sheetTitle').value.trim();
    const titleEl = document.getElementById('dispTitle');
    titleEl.textContent = titleVal;
    titleEl.style.display = titleVal ? 'block' : 'none';

    const mode = document.getElementById('sheetMode').value;
    const fontClass = document.getElementById('fontStyle').value === 'dotted' ? 'font-dotted' : 'font-solid';
    const dotMode = document.getElementById('dotMode').value;
    const body = document.getElementById('sheetBody');

    if (items.length === 0) {
      body.innerHTML = '';
      return;
    }

    if (mode === 'match') {
      const leftHtml = items.map((item, idx) => {
        const dot = dotMode !== 'none'
          ? `<span class="anchor-dot" style="background:${item.color};" onclick="cycleDotColor(${idx})" title="Click to change dot color"></span>`
          : '';
        return `
          <div class="word-row">
            <span class="word-label ${fontClass}">${item.word}</span>
            ${dot}
          </div>`;
      }).join('');

      const rightHtml = shuffledOrder.map(origIdx => {
        const item = items[origIdx];
        let rightDot = '';
        if (dotMode === 'both-colored') {
          rightDot = `<span class="anchor-dot" style="background:${item.color};" onclick="cycleDotColor(${origIdx})" title="Click to change dot color"></span>`;
        } else if (dotMode === 'left-empty-right') {
          rightDot = `<span class="target-dot-empty"></span>`;
        }
        return `
          <div class="picto-row">
            ${rightDot}
            ${renderPictoBox(origIdx)}
          </div>`;
      }).join('');

      body.innerHTML = `
        <div class="match-grid">
          <div class="left-col">${leftHtml}</div>
          <div class="right-col">${rightHtml}</div>
        </div>`;
    } else if (mode === 'reference') {
      body.innerHTML = items.map((item, idx) => {
        const dot = dotMode !== 'none'
          ? `<span class="anchor-dot" style="background:${item.color};" onclick="cycleDotColor(${idx})" title="Click to change dot color"></span>`
          : '';
        return `
          <div class="ref-row">
            <div class="ref-left">
              ${dot}
              <span class="word-label ${fontClass}">${item.word}</span>
            </div>
            ${renderPictoBox(idx)}
          </div>`;
      }).join('');
    } else if (mode === 'cutpaste') {
      const slotsHtml = items.map(item => `
        <div class="cut-slot">
          <span class="word-label ${fontClass}">${item.word}</span>
          <div class="empty-drop-box"></div>
        </div>
      `).join('');

      const stripHtml = shuffledOrder.map(origIdx =>
        renderPictoBox(origIdx, 'cut-card')
      ).join('');

      body.innerHTML = `
        <div>
          <div class="cut-targets">${slotsHtml}</div>
          <div class="cut-strip">${stripHtml}</div>
        </div>`;
    }
  }

  window.addEventListener('DOMContentLoaded', () => {
    restoreSavedLogo();
    refreshSavedUnitsDropdown();
    updateSizes();
    fetchAllPictograms();
  });
</script>
</body>
</html>
